# Rule table for the Dala Foods carbon pipeline. FIRST MATCH WINS, top to bottom.
#
# Fields:
#   id        rule_id written to the audit file
#   gl        list of GL accounts the line must have (omit = any)
#   unit      list of unit codes the line must have (omit = any)
#   match     list of lower-case substrings; at least one must appear in the description (omit = any)
#   category  one of the 11 categories in categories.csv
#   ef_id     factor id from emission_factors.csv; special values:
#               by_gas  -> refrigerant factor picked from the gas name (R404A, R134A, R410A, R744)
#   method    activity (default) | spend | excluded | flight | rail
#   units     activity rules: unit code -> multiplier that converts the ledger quantity to the
#             factor's unit. Values: a number, a fraction like "1/4.1868", kg_in_text, grams_in_text.
#             A line whose unit is not listed does not match the rule.
#   reason    one short sentence for the audit file
#   review_if_unit_missing
#             true for activity items (milk, fuel, energy, packaging, chemicals, waste...). If such a
#             rule matches on GL/keywords but cannot convert the line (unit not listed, no weight in
#             the text) and the line ends up spend-based, the audit gets review_flag
#             "activity item computed by spend: unit not covered".
#
# Spend method: activity = (gross - VAT) / 1000 thousand KZT; tCO2e = activity * factor / 1000.

# ---------------------------------------------------------------- 3. GL excludes
# Runs before the milk rule: "Предоплата за молоко (аванс)" is GL 1610 and must not count as milk.
- id: EXCL_GL
  gl: ["3110", "3150", "1610", "7480", "7216"]
  category: EXCLUDE
  method: excluded
  reason: GL account is taxes, social contributions, advances, fines or per diem - no emissions purchased.

# ---------------------------------------------------------------- 4. GL-routed
# Freight GL 7110 is checked before any keyword: "Ж/д перевозка сухого молока" contains a milk word.
- id: FREIGHT_RAIL
  gl: ["7110"]
  unit: ["т"]
  match: ["ж/д", "жд ", "железнодорож", "rail"]
  category: S3_C4_TRANSPORT
  ef_id: EF_RAIL_TKM
  method: rail
  reason: Rail freight; tonnes x distance parsed from the description.

- id: FREIGHT_ROAD_REEFER
  gl: ["7110"]
  match: ["рефрижератор", "reefer"]
  category: S3_C4_TRANSPORT
  ef_id: EF_REEFER_TKM
  units: {ткм: 1}
  reason: Refrigerated road freight reported in tonne-km.

- id: FREIGHT_ROAD_TKM
  gl: ["7110"]
  category: S3_C4_TRANSPORT
  ef_id: EF_ROAD_TKM
  units: {ткм: 1}
  reason: Road freight reported in tonne-km.

- id: FREIGHT_SPEND
  gl: ["7110"]
  match: ["транспортн", "доставк", "көлік", "перевоз", "логист"]
  category: S3_C4_TRANSPORT
  ef_id: SP_FREIGHT_ROAD
  method: spend
  reason: Third-party freight without tonne-km; spend-based.

- id: TRAVEL_FLIGHT
  gl: ["7212"]
  match: ["авиабилет", "авиа", "flight"]
  category: S3_C6_TRAVEL
  method: flight
  reason: Flight; great-circle distance per leg between IATA codes x tickets.

- id: TRAVEL_HOTEL
  gl: ["7212"]
  match: ["гостиниц", "проживание", "отел", "hotel"]
  category: S3_C6_TRAVEL
  ef_id: EF_HOTEL_NIGHT
  units: {сут: 1}
  reason: Hotel stay; quantity is room-nights.

- id: TRAVEL_TAXI
  gl: ["7212"]
  match: ["такси", "taxi"]
  category: S3_C6_TRAVEL
  ef_id: SP_TAXI
  method: spend
  reason: Taxi; spend-based.

- id: CAPEX_VEHICLES
  gl: ["2411"]
  category: S3_C2_CAPITAL
  ef_id: SP_VEHICLES
  method: spend
  reason: Vehicle purchase booked as a fixed asset; spend-based capital good.

- id: CAPEX_CONSTRUCTION
  gl: ["2412"]
  category: S3_C2_CAPITAL
  ef_id: SP_CONSTRUCTION
  method: spend
  reason: Construction in progress; spend-based capital good.

- id: CAPEX_MACHINERY
  gl: ["2410"]
  category: S3_C2_CAPITAL
  ef_id: SP_MACHINERY
  method: spend
  reason: Machinery booked as a fixed asset; spend-based capital good.

# ---------------------------------------------------------------- 5. Refrigerants
# A refill replaces gas that leaked, so refilled kg = released kg. Service lines (unit усл)
# carry the kg in the text, e.g. "дозаправка R404A 11.1 кг".
- id: REFRIGERANT
  review_if_unit_missing: true
  gl: ["1330", "8111"]
  match: ["r404", "r-404", "r134", "r-134", "r410", "r-410", "r744", "r-744", "фреон", "хладагент", "дозаправк"]
  category: S1_FUGITIVE
  ef_id: by_gas
  units: {кг: 1, усл: kg_in_text}
  reason: Refrigerant refill = leak; kg x GWP of the named gas.

# ---------------------------------------------------------------- 6. Energy
- id: ELECTRICITY
  review_if_unit_missing: true
  gl: ["8110", "7210"]
  match: ["электроэнерг", "электр энерг", "электр қуат", "electricity"]
  category: S2_ELECTRICITY
  ef_id: EF_GRID_KZ_KWH
  units: {кВт·ч: 1, МВт·ч: 1000}
  reason: Purchased grid electricity converted to kWh.

- id: DISTRICT_HEAT
  review_if_unit_missing: true
  gl: ["7210", "8110"]
  match: ["тепловая энерг", "теплоэнерг", "жылу", "heat"]
  category: S2_HEAT
  ef_id: EF_HEAT_GCAL
  units: {Гкал: 1, ГДж: "1/4.1868"}
  reason: Purchased district heat converted to Gcal (1 Gcal = 4.1868 GJ).

# ---------------------------------------------------------------- 7. Fuels
# Diesel bought for a hired carrier is burned in someone else's truck -> Scope 3 transport.
- id: FUEL_DIESEL_HIRED
