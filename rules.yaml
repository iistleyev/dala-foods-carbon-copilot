  match: ["бензин", "жанармай", "аи-92", "аи-95", "аи 92", "аи 95", "petrol", "gasoline"]
  category: S1_MOBILE
  ef_id: EF_PETROL_L
  units: {л: 1}
  reason: Petrol for own vehicles, in litres.

- id: FUEL_LPG
  review_if_unit_missing: true
  gl: ["1320"]
  match: ["суг", "сжиженн", "пропан", "lpg"]
  category: S1_MOBILE
