  ef_id: EF_NG_M3
  units: {м3: 1, тыс. м3: 1000}
  reason: Natural gas burned in the own boiler house, in m3.

# ---------------------------------------------------------------- 8. Raw milk
# GL 1310 is raw materials = raw milk only; descriptions have many typos, so the GL decides.
- id: RAW_MILK
  review_if_unit_missing: true
  gl: ["1310"]
  category: S3_C1_GOODS
  ef_id: EF_MILK_KG
  units: {кг: 1, л: 1.03, т: 1000}
