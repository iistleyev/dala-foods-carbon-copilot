  match: ["наемн", "перевозчик"]
  category: S3_C4_TRANSPORT
  ef_id: EF_DIESEL_L
  units: {л: 1}
  reason: Diesel for a hired third-party carrier - Scope 3 upstream transport.

- id: FUEL_DIESEL_T
  review_if_unit_missing: true
  gl: ["1320"]
  match: ["дизел", "дт", "diesel"]
  unit: ["т"]
  category: S1_MOBILE
  ef_id: EF_DIESEL_T
  units: {т: 1}
  reason: Diesel for own fleet, in tonnes.

- id: FUEL_DIESEL_L
