  units: {кг: 1, л: 0.54}
  reason: LPG for own forklifts converted to kg (0.54 kg/l).

- id: FUEL_NATURAL_GAS
  review_if_unit_missing: true
  gl: ["8110", "7210"]
  match: ["природный газ", "табиғи газ", "natural gas"]
