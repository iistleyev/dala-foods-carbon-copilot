# Inputs for analysis.py: green-loan scenarios, product footprint and the CFO cost model.
#
# Every value marked ASSUMPTION is NOT in the case data pack. They are reasonable starting points
# to be confirmed with an engineer / the CFO, and the jury should see them labelled as assumptions.
# Values marked DATA PACK come from the case files.

loan:
  amount_kzt: 5_000_000_000          # DATA PACK (Inbox): KZT 5 bn green loan, rooftop solar + heat pumps

solar:
  capacity_kwp: 3000                 # ASSUMPTION: ~18,000 m2 of usable roof at ~6 m2 per kWp
  specific_yield_kwh_per_kwp: 1350   # ASSUMPTION: typical annual yield for Almaty region
  capex_kzt_per_kwp: 300_000         # ASSUMPTION: rooftop commercial PV, installed

heat_pump:
  share_of_boiler_heat: 0.40         # ASSUMPTION: low-temperature heat (pasteurisation, CIP, hot water);
                                     # high-pressure steam stays on gas
  cop_base: 3.0                      # ASSUMPTION: seasonal COP at ~80-90 C supply
  cop_range: [2.5, 3.0, 3.5, 4.0, 4.5]
  boiler_efficiency: 0.90            # ASSUMPTION: gas steam boiler, net
  gas_ncv_mj_per_m3: 34              # DATA PACK: note on EF_NG_M3 in emission_factors.csv
  full_load_hours: 6000              # ASSUMPTION: for sizing capacity only
  capex_kzt_per_kwth: 450_000        # ASSUMPTION: industrial heat pump, installed

product:
  finished_product_t: 105_000        # DATA PACK (Company_Profile and brief)
  density_kg_per_l: 1.03             # DATA PACK: milk density on EF_MILK_KG; used for per-litre figures
  # Product carbon footprint boundary (cradle-to-gate, ISO 14067 / GHG Protocol Product Standard style):
  # capital goods and business travel are reported in the corporate inventory but left out of the
  # product footprint.
  exclude_stages: [capital goods, business travel]

cost_model:                          # KZT per year. ALL ASSUMPTIONS: replace with Dala Foods' own rates.
  budget_kzt: 15_000_000             # DATA PACK (Inbox, CFO)
  items:
    - item: Annual run and review of flagged lines (accountant)
      days: 10
      day_rate_kzt: 45_000
    - item: Rule and factor-library update (analyst / developer)
      days: 15
      day_rate_kzt: 60_000
    - item: Internal second check before external assurance
      days: 5
      day_rate_kzt: 60_000
    - item: Training and handover when staff change
      days: 5
      day_rate_kzt: 60_000
    - item: Hardware, cloud and licences (runs on an existing laptop, open-source Python)
      days: 0
      day_rate_kzt: 0
  contingency_share: 0.20
